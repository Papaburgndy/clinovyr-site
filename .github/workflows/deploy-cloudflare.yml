# Deploy clinovyr-site (OpenNext) to Cloudflare Workers when GitHub Actions secrets are configured.
# If you use Cloudflare Workers Git Builds instead, this workflow skips (green) on push — see DEPLOY.md.

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (secrets.CLOUDFLARE_API_TOKEN != '' || secrets.CF_API_TOKEN != '' || secrets.WRANGLER_API_TOKEN != '')
      && (secrets.CLOUDFLARE_ACCOUNT_ID != '' || secrets.CF_ACCOUNT_ID != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Wrangler reads CLOUDFLARE_API_TOKEN; accept common alternate secret names from tooling/sync.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy deliverables Worker
        run: npm run deploy:deliverables
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Build and deploy main Worker
        run: npm run deploy
        env:
          # Build-time placeholder only; runtime uses Worker secrets for DATABASE_URL
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  skip-no-secrets:
    if: >-
      secrets.CLOUDFLARE_API_TOKEN == '' && secrets.CF_API_TOKEN == '' && secrets.WRANGLER_API_TOKEN == ''
    runs-on: ubuntu-latest
    steps:
      - name: Skip GitHub Actions deploy (no Cloudflare secrets)
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set — skipping GitHub Actions deploy."
          echo ""
          echo "If you deploy with Cloudflare Workers Git Builds (clinovyr-site + clinovyr-deliverables),"
          echo "this is expected. Production deploys run from the Cloudflare dashboard, not this workflow."
          echo ""
          echo "To deploy via GitHub Actions instead, add repository secrets under"
          echo "Settings → Secrets and variables → Actions:"
          echo "  - CLOUDFLARE_API_TOKEN (or CF_API_TOKEN / WRANGLER_API_TOKEN)"
          echo "  - CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID)"
          echo ""
          echo "See DEPLOY.md for details."
